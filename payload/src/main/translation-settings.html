<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'none'; base-uri 'none'; form-action 'none'"><title>FigBoost · 汉化设置</title><link rel="stylesheet" href="translation-settings.css"></head>
<body><main>
<header><div><p class="eyebrow">FIGBOOST</p><h1>汉化设置</h1><p class="muted">常规界面使用词库汉化，社区可单独开启 Google 补译。</p></div><span id="connection" class="badge">正在读取</span></header>
<div id="message" role="status" aria-live="polite">正在读取设置…</div>
<section aria-labelledby="translate-title"><label class="switch"><span><strong id="translate-title">词库汉化</strong><small>用于 Figma 编辑器、文件页、菜单和社区的固定界面词汇。</small></span><input type="checkbox" id="enabled" disabled></label>
<div class="setting-divider"></div>
<label class="switch"><span><strong>社区 Google 补译</strong><small>只补译 Community 页面中词库未收录的安全文案。</small></span><input type="checkbox" id="community-online" disabled></label>
<p class="muted">社区文案仍然优先匹配内置词库，Google 结果会经过 Figma／UI 设计术语校正后缓存在本机。编辑器、文件页及桌面菜单不会发送给 Google。画布内容、输入值和用户命名不参与翻译。</p>
<p id="last-error" class="status-note"></p><p id="page-status" class="muted"></p><p id="cache-status" class="muted"></p></section>
<footer>内置词库用于全部可识别界面；Google 只补译社区页面。个人数据保存在本机，更新时保留。</footer>
</main><script src="translation-settings.js"></script></body></html>
